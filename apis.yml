aid: oula-health
name: Oula Health
description: 'Oula Health (Oula) is a modern maternity and women''s health provider operating
  collaborative-care clinics in New York and Connecticut. Oula pairs OBGYNs with certified
  nurse midwives to deliver comprehensive support before, during, and after pregnancy —
  including preconception planning, prenatal and postpartum care, gynecology, and miscarriage
  care — and partners with health systems, employers, and payers to extend that model. It
  is a patient-facing healthcare provider and does not currently publish a public developer
  platform, API, or technical integration surface.'
